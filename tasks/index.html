<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyStack — Task Manager</title>
<style>
  :root{
    --bg:#F6F4F1; --surface:#FFF; --line:#E2DDD5; --text:#2B2924; --muted:#7A756B;
    --accent:#3F6B52; --accent-text:#FFF; --danger:#B3543F; --focus:#1E4A34;
    --low:#7A756B; --med:#B3803F; --high:#B3543F;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:"Inter","Segoe UI",system-ui,sans-serif; line-height:1.5; }
  h1{ font-family:"Space Grotesk","Inter",sans-serif; font-size:clamp(1.5rem,5vw,2rem); margin:0 0 .2rem; }
  button, input, select{ font-family:inherit; font-size:1rem; }
  button{ cursor:pointer; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--focus); outline-offset:2px; border-radius:4px;
  }
  .skip-link{
    position:absolute; left:1rem; top:-50px; background:var(--accent); color:var(--accent-text);
    padding:.6rem 1rem; border-radius:6px; font-weight:600; text-decoration:none; transition:top .15s ease; z-index:10;
  }
  .skip-link:focus{ top:1rem; }
  header, main{ max-width:600px; margin:0 auto; padding-left:1rem; padding-right:1rem; }
  header{ padding-top:1.4rem; }
  header p{ color:var(--muted); margin:.2rem 0 0; font-size:.92rem; }
  main{ padding-bottom:3rem; }

  form#add-form{ display:flex; gap:.5rem; margin:1rem 0 .8rem; flex-wrap:wrap; }
  #new-task{ flex:1 1 160px; padding:.75rem .9rem; border-radius:8px; border:1px solid var(--line); background:var(--surface); }
  #new-task[aria-invalid="true"]{ border-color:var(--danger); }
  #new-priority{ flex:0 1 120px; padding:.75rem .5rem; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); }
  .add-btn{ background:var(--accent); color:var(--accent-text); border:none; padding:0 1.1rem; border-radius:8px; font-weight:600; }
  .add-btn:hover{ opacity:.92; }
  #form-error{ color:var(--danger); font-size:.85rem; min-height:1.2em; margin:-.4rem 0 .6rem; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:.9rem; }
  #search{ flex:1 1 160px; padding:.6rem .8rem; border-radius:8px; border:1px solid var(--line); background:var(--surface); }
  #sort{ padding:.55rem .5rem; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); }

  .filters{ display:flex; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap; }
  .filter-btn{ background:var(--surface); border:1px solid var(--line); padding:.45rem .9rem; border-radius:999px; font-size:.85rem; }
  .filter-btn[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:600; }

  ul#task-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.55rem; }
  .task{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:9px; padding:.7rem .8rem; display:flex; align-items:center; gap:.7rem; }
  .task.p-high{ border-left-color:var(--high); }
  .task.p-med{ border-left-color:var(--med); }
  .task.p-low{ border-left-color:var(--low); }
  .task.done .task-text{ color:var(--muted); text-decoration:line-through; }
  .check-btn{ width:26px; height:26px; border-radius:7px; border:2px solid var(--line); background:var(--surface); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .task.done .check-btn{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  .check-btn svg{ width:14px; height:14px; }
  .task-main{ flex:1; min-width:0; }
  .task-text{ display:block; word-break:break-word; background:none; border:none; padding:0; text-align:left; color:inherit; font-size:1rem; }
  button.task-text:hover{ text-decoration:underline; }
  .task-edit-input{ width:100%; padding:.35rem .5rem; border-radius:6px; border:1px solid var(--accent); font-size:1rem; }
  .priority-tag{ font-size:.75rem; color:var(--muted); text-transform:capitalize; }
  .task-actions{ display:flex; gap:.4rem; flex-shrink:0; }
  .delete-btn{ background:transparent; border:1px solid var(--line); color:var(--muted); width:30px; height:30px; border-radius:7px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .delete-btn:hover{ border-color:var(--danger); color:var(--danger); }
  .delete-btn svg{ width:14px; height:14px; }

  .empty-msg{ color:var(--muted); text-align:center; padding:2rem 1rem; border:1px dashed var(--line); border-radius:9px; }

  .summary{ color:var(--muted); font-size:.85rem; margin-top:1.2rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  .clear-btn{ background:none; border:none; color:var(--accent); font-weight:600; font-size:.85rem; padding:.2rem; }
  .clear-btn:hover{ text-decoration:underline; }

  .visually-hidden{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to main content</a>

<header>
  <a href="../" style="color:var(--muted); font-size:0.85rem; text-decoration:none;">← Back to project hub</a>
  <h1>DailyStack</h1>
  <p>A small task manager to keep today on track.</p>
</header>

<div id="live-region" class="visually-hidden" aria-live="polite"></div>

<main id="main">
  <form id="add-form" novalidate>
    <label for="new-task" class="visually-hidden">New task</label>
    <input id="new-task" type="text" placeholder="Add a task…" aria-describedby="form-error">
    <label for="new-priority" class="visually-hidden">Priority</label>
    <select id="new-priority">
      <option value="low">Low</option>
      <option value="med" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit" class="add-btn">Add</button>
  </form>
  <p id="form-error" role="status"></p>

  <div class="toolbar">
    <label for="search" class="visually-hidden">Search tasks</label>
    <input id="search" type="text" placeholder="Search tasks…">
    <label for="sort" class="visually-hidden">Sort tasks</label>
    <select id="sort">
      <option value="added">Newest first</option>
      <option value="priority">By priority</option>
      <option value="az">A–Z</option>
    </select>
  </div>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button class="filter-btn" aria-pressed="true" data-filter="all">All</button>
    <button class="filter-btn" aria-pressed="false" data-filter="active">Active</button>
    <button class="filter-btn" aria-pressed="false" data-filter="done">Done</button>
  </div>

  <ul id="task-list"></ul>

  <div class="summary">
    <span id="task-count">0 tasks</span>
    <button class="clear-btn" id="clear-done">Clear completed</button>
  </div>
</main>

<script>
(function(){
  "use strict";

  var PRIORITY_ORDER = { high:0, med:1, low:2 };

  function load(){
    try{ return JSON.parse(localStorage.getItem("dailystack_tasks")) || []; }
    catch(e){ return []; }
  }
  function save(tasks){
    try{ localStorage.setItem("dailystack_tasks", JSON.stringify(tasks)); }catch(e){}
  }

  var tasks = load();
  var nextId = tasks.reduce(function(max,t){ return Math.max(max, t.id); }, 0) + 1;
  var state = { filter:"all", query:"", sort:"added" };

  var list = document.getElementById("task-list");
  var countEl = document.getElementById("task-count");
  var live = document.getElementById("live-region");

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function visibleTasks(){
    var items = tasks.slice();
    if(state.filter === "active") items = items.filter(function(t){ return !t.done; });
    if(state.filter === "done") items = items.filter(function(t){ return t.done; });
    if(state.query.trim()){
      var q = state.query.trim().toLowerCase();
      items = items.filter(function(t){ return t.text.toLowerCase().indexOf(q) !== -1; });
    }
    if(state.sort === "priority") items.sort(function(a,b){ return PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority]; });
    if(state.sort === "az") items.sort(function(a,b){ return a.text.localeCompare(b.text); });
    return items;
  }

  function render(){
    var items = visibleTasks();
    list.innerHTML = "";

    if(items.length === 0){
      var msg = document.createElement("li");
      msg.className = "empty-msg";
      msg.textContent = tasks.length === 0 ? "No tasks yet — add your first one above." : "No tasks match your search/filter.";
      list.appendChild(msg);
    } else {
      items.forEach(function(t){
        var li = document.createElement("li");
        li.className = "task p-" + t.priority + (t.done ? " done" : "");
        li.innerHTML =
          '<button class="check-btn" data-id="' + t.id + '" aria-pressed="' + t.done + '" aria-label="' +
            (t.done ? "Mark \"" + escapeHtml(t.text) + "\" as not done" : "Mark \"" + escapeHtml(t.text) + "\" as done") + '">' +
            (t.done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>' : '') +
          '</button>' +
          '<div class="task-main">' +
            '<button class="task-text" data-id="' + t.id + '" aria-label="Edit \'' + escapeHtml(t.text) + '\'">' + escapeHtml(t.text) + '</button>' +
            '<span class="priority-tag">' + t.priority + ' priority</span>' +
          '</div>' +
          '<div class="task-actions">' +
            '<button class="delete-btn" data-id="' + t.id + '" aria-label="Delete \'' + escapeHtml(t.text) + '\'">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
            '</button>' +
          '</div>';
        list.appendChild(li);
      });
    }

    var doneCount = tasks.filter(function(t){ return t.done; }).length;
    countEl.textContent = tasks.length + (tasks.length === 1 ? " task" : " tasks") + (tasks.length ? " · " + doneCount + " done" : "");
  }

  render();

  document.getElementById("add-form").addEventListener("submit", function(e){
    e.preventDefault();
    var input = document.getElementById("new-task");
    var prioritySel = document.getElementById("new-priority");
    var errEl = document.getElementById("form-error");
    var value = input.value.trim();
    if(!value){
      errEl.textContent = "Type a task before adding it.";
      input.setAttribute("aria-invalid","true");
      input.focus();
      return;
    }
    errEl.textContent = "";
    input.removeAttribute("aria-invalid");
    tasks.unshift({ id: nextId++, text: value, done:false, priority: prioritySel.value });
    save(tasks);
    render();
    live.textContent = value + " added.";
    input.value = "";
    input.focus();
  });

  function startEdit(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if(!t) return;
    var textBtn = list.querySelector('.task-text[data-id="' + id + '"]');
    if(!textBtn) return;
    var input = document.createElement("input");
    input.type = "text";
    input.className = "task-edit-input";
    input.value = t.text;
    input.setAttribute("aria-label", "Edit task text");
    textBtn.replaceWith(input);
    input.focus();
    input.select();

    var settled = false;
    function commit(){
      if(settled) return;
      settled = true;
      var val = input.value.trim();
      if(val){ t.text = val; save(tasks); live.textContent = "Task updated."; }
      render();
    }
    function cancel(){
      if(settled) return;
      settled = true;
      render();
    }
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); commit(); }
      else if(e.key === "Escape"){ e.preventDefault(); cancel(); }
    });
    input.addEventListener("blur", commit);
  }

  list.addEventListener("click", function(e){
    var textBtn = e.target.closest(".task-text");
    if(textBtn){ startEdit(parseInt(textBtn.dataset.id, 10)); return; }

    var checkBtn = e.target.closest(".check-btn");
    if(checkBtn){
      var id = parseInt(checkBtn.dataset.id, 10);
      var t = tasks.find(function(x){ return x.id === id; });
      if(t){
        t.done = !t.done;
        save(tasks);
        render();
        live.textContent = t.text + (t.done ? " marked done." : " marked not done.");
      }
      return;
    }
    var delBtn = e.target.closest(".delete-btn");
    if(delBtn){
      var did = parseInt(delBtn.dataset.id, 10);
      var dt = tasks.find(function(x){ return x.id === did; });
      tasks = tasks.filter(function(x){ return x.id !== did; });
      save(tasks);
      render();
      live.textContent = (dt ? dt.text : "Task") + " deleted.";
      document.getElementById("new-task").focus();
    }
  });

  document.querySelectorAll(".filter-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".filter-btn").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      state.filter = btn.dataset.filter;
      render();
    });
  });

  var searchDebounce;
  document.getElementById("search").addEventListener("input", function(e){
    clearTimeout(searchDebounce);
    var val = e.target.value;
    searchDebounce = setTimeout(function(){
      state.query = val;
      render();
    }, 200);
  });

  document.getElementById("sort").addEventListener("change", function(e){
    state.sort = e.target.value;
    render();
  });

  document.getElementById("clear-done").addEventListener("click", function(){
    var removed = tasks.filter(function(t){ return t.done; }).length;
    tasks = tasks.filter(function(t){ return !t.done; });
    save(tasks);
    render();
    live.textContent = removed + " completed task" + (removed===1?"":"s") + " cleared.";
  });

})();
</script>
</body>
</html>
